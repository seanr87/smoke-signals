<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="600" fill="#fcfcfb"/><text x="24.0" y="30.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">A2 (round 5b): radar deaths from the full radar log</text><text x="24.0" y="48.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Left: deaths in destroyer smokes with the ship radar-lit in its last 40 s, by how far the radar ship was (share of its radar range). Right: deaths per 100 destroyer smokes with and without radar.</text><text x="40.0" y="90.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Distance to the radar ship as a share of its range (n 91, all track deaths)</text><text x="140.0" y="126.0" font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="400">under 40%</text><rect x="150" y="110" width="45" height="24" fill="#184f95"/><text x="172.5" y="126.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">5</text><rect x="195" y="110" width="9" height="24" fill="#eda100"/><text x="210.0" y="126.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">6</text><text x="140.0" y="158.0" font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="400">40-60%</text><rect x="150" y="142" width="18" height="24" fill="#184f95"/><text x="159.0" y="158.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">2</text><text x="174.0" y="158.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">2</text><text x="140.0" y="190.0" font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="400">60-80%</text><rect x="150" y="174" width="162" height="24" fill="#184f95"/><text x="231.0" y="190.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">18</text><rect x="312" y="174" width="27" height="24" fill="#eda100"/><text x="325.5" y="190.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">3</text><text x="345.0" y="190.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">21</text><text x="140.0" y="222.0" font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="400">80-90%</text><rect x="150" y="206" width="162" height="24" fill="#184f95"/><text x="231.0" y="222.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">18</text><rect x="312" y="206" width="27" height="24" fill="#eda100"/><text x="325.5" y="222.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">3</text><text x="345.0" y="222.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">21</text><text x="140.0" y="254.0" font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="400">90-100%</text><rect x="150" y="238" width="333" height="24" fill="#184f95"/><text x="316.5" y="254.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">37</text><rect x="483" y="238" width="36" height="24" fill="#eda100"/><text x="501.0" y="254.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">4</text><text x="525.0" y="254.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">41</text><rect x="150" y="275" width="12" height="12" rx="2" fill="#184f95"/><text x="167.0" y="285.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">radar cruiser</text><rect x="280" y="275" width="12" height="12" rx="2" fill="#eda100"/><text x="297.0" y="285.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">radar destroyer</text><rect x="424" y="275" width="12" height="12" rx="2" fill="#8a8984"/><text x="441.0" y="285.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">radar battleship</text><text x="40.0" y="320.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="400">92 of 201 deaths radar-lit in the last 40 s (45.8%); 79 in the last 20 s.</text><text x="40.0" y="340.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Radar ship itself in a smoke: 3 of 91. Ambiguous: 5.</text><text x="40.0" y="360.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Lit for a median 13.6 s before dying; still lit at death: 42.</text><text x="40.0" y="380.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Top radar ships: Moskva 26, Brisbane 10, Petropavlovsk 10, Des Moines 10, San Martín 7, Gdańsk 6</text><text x="600.0" y="90.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Deaths per 100 destroyer smokes (batch death list)</text><text x="600.0" y="122.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">all destroyer smokes *</text><text x="730.0" y="142.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">radar-lit (n 388)</text><rect x="738" y="130" width="167.2" height="14" rx="2" fill="#e34948"/><text x="911.2" y="141.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">20.9</text><text x="730.0" y="160.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">no radar (n 686)</text><rect x="738" y="148" width="50.4" height="14" rx="2" fill="#b9b8b3"/><text x="794.4" y="159.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">6.3</text><text x="600.0" y="190.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">ahead 50+ *</text><text x="730.0" y="210.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">radar-lit (n 114)</text><rect x="738" y="198" width="105.6" height="14" rx="2" fill="#e34948"/><text x="849.6" y="209.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">13.2</text><text x="730.0" y="228.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">no radar (n 258)</text><rect x="738" y="216" width="28.0" height="14" rx="2" fill="#b9b8b3"/><text x="772.0" y="227.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">3.5</text><text x="600.0" y="258.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">level *</text><text x="730.0" y="278.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">radar-lit (n 168)</text><rect x="738" y="266" width="124.0" height="14" rx="2" fill="#e34948"/><text x="868.0" y="277.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">15.5</text><text x="730.0" y="296.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">no radar (n 257)</text><rect x="738" y="284" width="31.2" height="14" rx="2" fill="#b9b8b3"/><text x="775.2" y="295.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">3.9</text><text x="600.0" y="326.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">behind 50+ *</text><text x="730.0" y="346.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">radar-lit (n 106)</text><rect x="738" y="334" width="301.6" height="14" rx="2" fill="#e34948"/><text x="1045.6" y="345.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">37.7</text><text x="730.0" y="364.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">no radar (n 171)</text><rect x="738" y="352" width="112.0" height="14" rx="2" fill="#b9b8b3"/><text x="856.0" y="363.5" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="400">14.0</text><text x="600.0" y="396.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Calm smokes (not 50+ behind, no radar in the log): 515 smokes, 19 deaths, 3.7 per 100.</text><text x="600.0" y="416.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">* = with-radar minus no-radar interval excludes zero.</text></svg>